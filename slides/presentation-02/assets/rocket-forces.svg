<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Forces and lever arms on a rocket</title><desc id="desc">Schematic: gravity acts downward through the centre of mass; aerodynamic force acts at the pressure point above it; thrust acts at the engine below it. A force perpendicular to a lever arm produces torque.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6B2C5C"/></marker><marker id="dark" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#15120B"/></marker></defs>
<g font-family="sans-serif" font-size="22" fill="#15120B">
<path d="M400 315 L400 85 L425 30 L450 85 L450 315 Z" fill="#6B2C5C" fill-opacity=".08" stroke="#6B2C5C" stroke-width="3"/>
<path d="M400 315 L382 333 M450 315 L468 333" stroke="#15120B" stroke-width="3"/>
<circle cx="425" cy="200" r="7" fill="#15120B"/><circle cx="425" cy="112" r="5" fill="#6B2C5C"/><circle cx="425" cy="310" r="5" fill="#6B2C5C"/>
<path d="M425 112 L270 112" stroke="#6B2C5C" stroke-width="4" marker-end="url(#arrow)"/>
<text x="60" y="80">Aerodynamic force</text><text x="60" y="108" font-size="18" fill="#6B6149">Applied at pressure point</text>
<path d="M425 310 L365 220" stroke="#6B2C5C" stroke-width="4" marker-end="url(#arrow)"/>
<text x="85" y="265">Engine thrust</text><text x="85" y="293" font-size="18" fill="#6B6149">Direction depends on gimbal</text>
<path d="M425 200 L425 285" fill="none" stroke="#15120B" stroke-width="3" marker-end="url(#dark)"/>
<text x="550" y="285">Gravity: mg downward</text><text x="550" y="313" font-size="18" fill="#6B6149">Acts through centre of mass</text>
<path d="M425 200 L485 200" stroke="#15120B" stroke-width="2"/><text x="500" y="195">Centre of mass</text>
<path d="M473 195 L473 117" stroke="#6B2C5C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="120">Lever arm r</text><text x="500" y="150" font-size="18" fill="#6B6149">From centre of mass to pressure point</text>
<text x="700" y="40" font-size="18" fill="#6B6149">Schematic; forces are illustrative</text>
</g></svg>
