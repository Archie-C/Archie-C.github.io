<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Gravity projection</title><desc id="desc">Gravity acts downward through the centre of mass; no torque is included.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6B2C5C"/></marker><marker id="dark" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#15120B"/></marker></defs>
<g font-family="sans-serif" font-size="22" fill="#15120B">
<path d="M400 315 L400 85 L425 30 L450 85 L450 315 Z" fill="#6B2C5C" fill-opacity=".08" stroke="#6B2C5C" stroke-width="3"/>
<path d="M400 315 L382 333 M450 315 L468 333" stroke="#15120B" stroke-width="3"/>
<circle cx="425" cy="200" r="7"/>
<path d="M425 200 L485 200" stroke="#15120B" stroke-width="2"/><text x="500" y="205">Centre of mass</text>
<path d="M425 200 L425 285" stroke="#15120B" stroke-width="3" marker-end="url(#dark)"/>
<text x="550" y="282">Gravity: mg downward</text><text x="550" y="313" font-size="18" fill="#6B6149">Acts through centre of mass</text><text x="550" y="78">Vertical acceleration: −g</text>
<text x="550" y="113">Angular acceleration: 0</text>
<text x="70" y="110" font-size="18" fill="#6B6149">Drag and thrust omitted</text><text x="720" y="345" font-size="16" fill="#6B6149">Schematic; arrows are illustrative</text></g></svg>
