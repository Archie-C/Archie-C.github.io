<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-labelledby="title desc"><title id="title">Landing results before and after this change</title><desc id="desc">Paired bars show successful landings out of ten and mean landing score out of one hundred. Before is grey; after is purple.</desc><g font-family="sans-serif" fill="#15120B"><rect x="28" y="15" width="14" height="14" fill="#6B6149"/><text x="51" y="28" font-size="19">Before</text><rect x="215" y="15" width="14" height="14" fill="#6B2C5C"/><text x="238" y="28" font-size="19">After</text><text x="28" y="75" font-size="20">Successful landings</text><rect x="28" y="92" width="252" height="22" fill="#DCD2BC" fill-opacity=".4"/><rect x="28" y="92" width="0.000" height="22" fill="#6B6149"/><text x="292" y="109" font-size="19">0/10</text><rect x="28" y="130" width="252" height="22" fill="#DCD2BC" fill-opacity=".4"/><rect x="28" y="130" width="25.200" height="22" fill="#6B2C5C"/><text x="292" y="147" font-size="19">1/10</text><text x="28" y="225" font-size="20">Mean landing score</text><rect x="28" y="242" width="252" height="22" fill="#DCD2BC" fill-opacity=".4"/><rect x="28" y="242" width="0.000" height="22" fill="#6B6149"/><text x="292" y="259" font-size="19">0.0/100</text><rect x="28" y="280" width="252" height="22" fill="#DCD2BC" fill-opacity=".4"/><rect x="28" y="280" width="22.967" height="22" fill="#6B2C5C"/><text x="292" y="297" font-size="19">9.1/100</text></g></svg>
